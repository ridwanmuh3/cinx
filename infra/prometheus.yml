# Prometheus scrapes OTLP metrics off the collector's prometheus exporter.
# Service discovery is static: the collector fans every service in, so one
# job is enough. Per-service series are split by the `service_name` label
# (mapped from the OTel resource attribute by the collector).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
