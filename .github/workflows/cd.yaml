name: CD

# Continuous deployment: builds every deployable and pushes its image to
# GitHub Container Registry on every push to `main`.
#
# Running locally with act (https://github.com/nektos/act):
#   act -W .github/workflows/cd.yaml
# act sets ACT=true, so the login/push steps are skipped and images are
# only loaded into the local Docker daemon (never published).

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - user-service
          - cinema-service
          - ticket-service
          - web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ !env.ACT }}
          load: ${{ env.ACT }}
          tags: |
            ghcr.io/ridwanmuh3/ticketing-cinema/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/ridwanmuh3/ticketing-cinema/${{ matrix.service }}:latest
