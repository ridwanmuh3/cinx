name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails in seconds — run before the multi-minute lint/test/build steps.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
        env:
          # Telemetry exporters must stay silent and side-effect free in tests.
          OTEL_SDK_DISABLED: 'true'

      - name: Build
        run: pnpm build

      - name: Validate compose files (incl. observability stack)
        run: |
          docker compose config -q
          docker compose -f infra/docker-compose.yml config -q
