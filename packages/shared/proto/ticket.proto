syntax = "proto3";

package ticket;

import "google/protobuf/empty.proto";

service TicketService {
  rpc Ping(google.protobuf.Empty) returns (PingReply) {}
  rpc ListTickets(TicketListRequest) returns (TicketList) {}
  rpc GetTicketByCode(TicketByCodeRequest) returns (TicketLookupDto) {}
  // Replay/repair paths. Normal issuance is driven by booking.confirmed.
  rpc IssueTickets(TicketIssueRequest) returns (TicketList) {}
  rpc VoidTickets(VoidTicketsRequest) returns (Empty) {}
}

message PingReply {
  string service = 1;
  string status = 2;
  string timestamp = 3;
}

message Empty {}

message TicketByCodeRequest {
  string code = 1;
}

message TicketListRequest {
  string bookingId = 1;
}

message TicketSeatInput {
  string seatId = 1;
  string rowLabel = 2;
  int32 seatNumber = 3;
}

message TicketIssueRequest {
  string bookingId = 1;
  string userId = 2;
  string showtimeId = 3;
  string movieTitle = 4;
  string theaterName = 5;
  string startsAt = 6;
  repeated TicketSeatInput seats = 7;
}

message VoidTicketsRequest {
  string bookingId = 1;
}

message TicketDto {
  string id = 1;
  string bookingId = 2;
  string code = 3;
  string movieTitle = 4;
  string theaterName = 5;
  string startsAt = 6;
  string seatId = 7;
  string row = 8;
  int32 number = 9;
  string createdAt = 10;
}

message TicketList {
  repeated TicketDto items = 1;
}

message TicketLookupDto {
  string id = 1;
  string code = 2;
  string bookingId = 3;
  string showtimeId = 4;
  string movieTitle = 5;
  string theaterName = 6;
  string startsAt = 7;
  string seatId = 8;
  string row = 9;
  int32 number = 10;
}
